<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Баня на колесах</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: Arial;
    color: white;
    background:
        radial-gradient(circle at 10% 20%, #003d1f, transparent 40%),
        radial-gradient(circle at 80% 10%, #022d18, transparent 50%),
        radial-gradient(circle at 30% 80%, #064d2b, transparent 50%),
        #000;
}

/* HEADER */
header {
    height: 100vh;
    background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)),
        url('7c3aea83-8fba-43a3-87b0-8109d30dcd21.avif') no-repeat center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

header h1 {
    font-size: 45px;
    background: rgba(0,0,0,0.5);
    padding: 30px;
    border-radius: 20px;
}

/* КНОПКА ВЫХОДА */
.logout {
    position: fixed;
    top: 20px;
    right: 20px;
    background: crimson;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
}

/* СЕКЦИИ */
.section {
    padding: 60px 20px;
    text-align: center;
}

/* ФОРМА */
.form-box {
    margin-top: 30px;
    background: rgba(255,255,255,0.05);
    padding: 25px;
    border-radius: 20px;
    display: inline-block;
}

input, textarea {
    width: 90%;
    padding: 12px;
    margin: 10px;
    border-radius: 10px;
    border: none;
}

button {
    padding: 12px 25px;
    border-radius: 10px;
    border: none;
    background: #00aa55;
    cursor: pointer;
}

.booking-list {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.booking-item {
    width: 300px;
    background: rgba(255,255,255,0.05);
    margin: 10px;
    padding: 15px;
    border-radius: 15px;
}

.delete {
    background: crimson;
    margin-top: 10px;
}

/* уведомление */
.toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #00aa55;
    padding: 15px;
    border-radius: 10px;
    display: none;
}
</style>
</head>

<body>

<!-- 🔐 ПРОВЕРКА ВХОДА -->
<script>
let user = localStorage.getItem("currentUser");

if (!user) {
    window.location.href = "index.html";
}
</script>

<div class="logout" onclick="logout()">Выйти</div>

<header>
    <h1>🔥 Баня на колесах 🔥</h1>
</header>

<section class="section">
    <h2>📅 Работаем</h2>
    <p>Пн–Чт | 10:00 – 22:00</p>

    <h2>📌 Запись</h2>

    <div class="form-box">
        <input type="date" id="date"><br>
        <input type="time" id="time"><br>
        <textarea id="comment" placeholder="Пожелания"></textarea><br>
        <button onclick="book()">Записаться</button>
    </div>

    <h3>Ваши записи:</h3>
    <div id="list" class="booking-list"></div>
</section>

<div id="toast" class="toast"></div>

<script>
function logout() {
    localStorage.removeItem("currentUser");
    window.location.href = "index.html";
}

function showToast(text) {
    let t = document.getElementById("toast");
    t.innerText = text;
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 5000);
}

date.addEventListener("change", function() {
    let d = new Date(this.value);
    let day = d.getDay();
    if (day < 1 || day > 4) {
        showToast("Нельзя выбрать эту дату");
        this.value = "";
    }
});

time.addEventListener("change", function() {
    let hour = parseInt(this.value.split(":")[0]);
    if (hour < 10 || hour >= 22) {
        showToast("Нельзя выбрать это время (10:00–22:00)");
        this.value = "";
    }
});

function book() {
    let d = date.value;
    let t = time.value;
    let c = comment.value;

    if (!d || !t) {
        showToast("Выбери дату и время");
        return;
    }

    let bookings = JSON.parse(localStorage.getItem(user+"_book")) || [];
    bookings.push({date:d, time:t, comment:c});

    localStorage.setItem(user+"_book", JSON.stringify(bookings));
    render();
}

function deleteBooking(i) {
    let bookings = JSON.parse(localStorage.getItem(user+"_book")) || [];
    bookings.splice(i, 1);
    localStorage.setItem(user+"_book", JSON.stringify(bookings));
    render();
}

function render() {
    let list = document.getElementById("list");
    list.innerHTML = "";

    let bookings = JSON.parse(localStorage.getItem(user+"_book")) || [];

    bookings.forEach((b, i) => {
        let div = document.createElement("div");
        div.className = "booking-item";

        div.innerHTML = `
            <b>${b.date}</b><br>
            ⏰ ${b.time}<br>
            💬 ${b.comment || "без пожеланий"}<br>
            <button class="delete" onclick="deleteBooking(${i})">Удалить</button>
        `;

        list.appendChild(div);
    });
}

render();
</script>

</body>
</html>
